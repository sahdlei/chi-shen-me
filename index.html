<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>餐谱助手</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F4EE;
    --surface: #FFFFFF;
    --surface2: #F0EDE6;
    --border: #DDD8CE;
    --text: #1C1A16;
    --muted: #7A7468;
    --accent: #B85C2A;
    --accent-light: #F5E8DF;
    --green: #3B6D11;
    --green-light: #EAF3DE;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo {
    font-family: 'Noto Serif SC', serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.02em;
  }
  .header-actions { display: flex; gap: 8px; align-items: center; }

  /* Layout */
  .container {
    flex: 1;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 0;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
    padding: 24px;
    gap: 20px;
  }

  /* Sidebar */
  .sidebar { display: flex; flex-direction: column; gap: 16px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .card-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }

  /* API Key */
  .api-input-row { display: flex; gap: 8px; }
  .provider-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  input[type=password], input[type=text] {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 13px;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: var(--accent); }

  /* Meal table */
  .meal-grid { display: flex; flex-direction: column; gap: 6px; }
  .meal-row {
    display: grid;
    grid-template-columns: 36px 1fr 1fr;
    gap: 6px;
    align-items: center;
  }
  .meal-day {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    text-align: center;
  }
  .meal-cell {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    color: var(--text);
    min-height: 30px;
    display: flex;
    align-items: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .meal-cell:empty::before { content: attr(data-placeholder); color: var(--muted); opacity: 0.6; font-size: 11px; }
  .meal-cell:hover { border-color: var(--accent); background: var(--accent-light); }
  .meal-cell.filled { color: var(--text); }
  .meal-header {
    display: grid;
    grid-template-columns: 36px 1fr 1fr;
    gap: 6px;
    margin-bottom: 4px;
  }
  .meal-header span {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    font-weight: 500;
  }

  /* Shopping list */
  .shop-list { list-style: none; }
  .shop-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .shop-item:last-child { border-bottom: none; }
  .shop-item input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }
  .shop-item.done span { text-decoration: line-through; color: var(--muted); }
  .shop-cat {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.06em;
    margin-top: 10px;
    margin-bottom: 4px;
    text-transform: uppercase;
  }

  /* Chat area */
  .chat-area {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 400px;
    max-height: 560px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
  }
  .msg.assistant {
    background: var(--surface2);
    border: 1px solid var(--border);
    align-self: flex-start;
    border-radius: 2px 10px 10px 10px;
  }
  .msg.user {
    background: var(--accent);
    color: #fff;
    align-self: flex-end;
    border-radius: 10px 2px 10px 10px;
  }
  .msg.system-note {
    background: var(--green-light);
    border: 1px solid #C0DD97;
    color: var(--green);
    align-self: center;
    font-size: 12px;
    border-radius: 20px;
    padding: 5px 14px;
    max-width: 100%;
    text-align: center;
  }
  .typing {
    background: var(--surface2);
    border: 1px solid var(--border);
    align-self: flex-start;
    border-radius: 2px 10px 10px 10px;
    padding: 10px 14px;
    font-size: 14px;
    color: var(--muted);
  }
  .typing-dots span {
    display: inline-block;
    width: 5px; height: 5px;
    background: var(--muted);
    border-radius: 50%;
    margin: 0 2px;
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }

  .chat-input-area {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  textarea#chat-input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    max-height: 120px;
    transition: border-color 0.15s;
  }
  textarea#chat-input:focus { border-color: var(--accent); }

  /* Buttons */
  .btn {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    background: var(--surface);
    color: var(--text);
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface2); border-color: #bbb; }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    padding: 9px 18px;
  }
  .btn.primary:hover { background: #9e4d22; }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* Inventory tags */
  .tag-area { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .tag {
    background: var(--accent-light);
    border: 1px solid #e8c4ae;
    color: var(--accent);
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .tag .rm { cursor: pointer; font-size: 14px; color: var(--accent); line-height: 1; }
  .tag-input-row { display: flex; gap: 6px; }
  .tag-input-row input { font-size: 12px; padding: 5px 8px; }

  .week-label {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 8px;
  }

  .empty-chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--muted);
    padding: 40px 20px;
  }
  .empty-chat .icon { font-size: 36px; }
  .empty-chat p { font-size: 14px; text-align: center; max-width: 260px; line-height: 1.7; }

  .quick-btns { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .quick-btn {
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg);
    cursor: pointer;
    color: var(--text);
    transition: background 0.15s;
  }
  .quick-btn:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }

  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #ccc; display: inline-block; margin-right: 5px;
  }
  .status-dot.ok { background: #4caf50; }
  .status-dot.err { background: #e53935; }

  .autocomplete-wrap { position: relative; flex: 1; }
  .autocomplete-wrap textarea { width: 100%; }
  .ac-dropdown {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 0; right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    z-index: 20;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    max-height: 200px;
    overflow-y: auto;
  }
  .ac-item {
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
    transition: background 0.1s;
  }
  .ac-item:hover, .ac-item.active { background: var(--accent-light); }
  .ac-item .ac-icon { font-size: 11px; color: var(--muted); }
  .ac-section {
    font-size: 10px;
    color: var(--muted);
    padding: 6px 12px 2px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-top: 1px solid var(--border);
  }
  .ac-section:first-child { border-top: none; }

  /* Editable meal cells */
  .meal-cell {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    color: var(--text);
    min-height: 30px;
    display: flex;
    align-items: center;
    cursor: text;
    transition: border-color 0.15s, background 0.15s;
  }
  .meal-input-cell {
    width: 100%;
    border: none;
    background: transparent;
    font-size: 12px;
    font-family: inherit;
    color: var(--text);
    outline: none;
    padding: 0;
  }
  .meal-input-cell::placeholder { color: var(--muted); opacity: 0.6; }
  .meal-cell:focus-within { border-color: var(--accent); background: var(--accent-light); }

  /* Inventory with date tooltip */
  .inv-tag {
    position: relative;
    background: var(--accent-light);
    border: 1px solid #e8c4ae;
    color: var(--accent);
    font-size: 12px;
    padding: 3px 10px 3px 8px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: default;
  }
  .inv-tag .rm { cursor: pointer; font-size: 14px; line-height: 1; }
  .inv-tooltip {
    display: none;
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: #fff;
    font-size: 11px;
    padding: 5px 9px;
    border-radius: 6px;
    white-space: nowrap;
    z-index: 50;
    line-height: 1.5;
    pointer-events: none;
  }
  .inv-tooltip::after {
    content: '';
    position: absolute;
    top: 100%; left: 50%;
    transform: translateX(-50%);
    border: 4px solid transparent;
    border-top-color: var(--text);
  }
  .inv-tag:hover .inv-tooltip { display: block; }
  .inv-tag.loading { opacity: 0.6; }
  .inv-tag.loading::after { content: ' ⏳'; font-size: 10px; }
  .shelf-source { font-size: 10px; opacity: 0.75; font-style: italic; }
  .pref-item {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--green-light);
    border: 1px solid #c0dd97;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    color: var(--green);
  }
  .pref-item span { flex: 1; line-height: 1.4; }
  .pref-rm { cursor: pointer; color: var(--green); font-size: 14px; flex-shrink: 0; background: none; border: none; font-family: inherit; line-height: 1; }
  .pref-rm:hover { color: #c0392b; }
  .inv-tooltip.warn { background: #c0392b; }
  .inv-tooltip.warn::after { border-top-color: #c0392b; }
  .inv-tooltip.caution { background: #e67e22; }
  .inv-tooltip.caution::after { border-top-color: #e67e22; }

  /* Freshness warning banner */
  .freshness-banner {
    background: #fdf3cd;
    border: 1px solid #f0d060;
    color: #7a5c00;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    line-height: 1.6;
    margin-bottom: 10px;
  }
  .freshness-banner strong { display: block; margin-bottom: 2px; }

  /* Shop item delete button */
  .shop-del {
    cursor: pointer;
    color: var(--muted);
    font-size: 16px;
    padding: 0 2px;
    line-height: 1;
    flex-shrink: 0;
    background: none;
    border: none;
    font-family: inherit;
  }
  .shop-del:hover { color: #c0392b; }

  @media (max-width: 700px) {
    .container { grid-template-columns: 1fr; padding: 12px; gap: 12px; }
    .chat-messages { max-height: 380px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">🍜 餐谱助手</div>
  <div class="header-actions">
    <span id="status-indicator"><span class="status-dot" id="dot"></span><span id="status-text" style="font-size:12px;color:var(--muted)">未连接</span></span>
    <button class="btn small" onclick="exportSVG()">导出餐表</button>
    <button class="btn small" onclick="exportShoppingSVG()">导出采购清单</button>
    <button class="btn small" onclick="resetWeek()">新的一周</button>
  </div>
</header>

<div class="container">
  <!-- Sidebar -->
  <div class="sidebar">
    <!-- API Key -->
    <div class="card">
      <div class="card-title">API 设置</div>
      <div style="display:flex;gap:6px;margin-bottom:8px">
        <button class="btn small provider-btn active" id="btn-anthropic" onclick="setProvider('anthropic')">Anthropic</button>
        <button class="btn small provider-btn" id="btn-deepseek" onclick="setProvider('deepseek')">DeepSeek</button>
      </div>
      <div class="api-input-row">
        <input type="password" id="api-key" placeholder="sk-ant-..." oninput="saveKey()">
        <button class="btn small" onclick="toggleKey()">显示</button>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px">存在本地，不会上传</div>

    </div>

    <!-- Inventory -->
    <div class="card">
      <div class="card-title">家里现有食材</div>
      <div id="freshness-banner" style="display:none"></div>
      <div class="tag-area" id="inventory-tags"></div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <input type="text" id="inv-input" placeholder="食材名称..." style="width:100%" onkeydown="if(event.key==='Enter')document.getElementById('inv-date').focus()">
        <div style="display:flex;gap:6px">
          <input type="date" id="inv-date" style="flex:1;font-size:12px;padding:5px 6px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-family:inherit" onkeydown="if(event.key==='Enter')addInventory()">
          <button class="btn small" onclick="addInventory()">添加</button>
        </div>
      </div>
    </div>

    <!-- Preferences -->
    <div class="card" id="prefs-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div class="card-title" style="margin-bottom:0">个人偏好</div>
        <span style="font-size:11px;color:var(--muted)">以 * 开头输入保存</span>
      </div>
      <div id="prefs-list" style="display:flex;flex-direction:column;gap:4px"></div>
    </div>

    <!-- Meal table -->
    <div class="card">
      <div class="card-title">本周餐谱</div>
      <div class="week-label" id="week-label"></div>
      <div class="meal-header">
        <span></span><span>午餐</span><span>晚餐</span>
      </div>
      <div class="meal-grid" id="meal-grid"></div>
      <button class="btn small" style="margin-top:10px;width:100%" onclick="askForShopping()">生成采购清单 →</button>
    </div>

    <!-- Shopping list -->
    <div class="card" id="shop-card" style="display:none">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div class="card-title" style="margin-bottom:0">采购清单</div>
        <button class="btn small" onclick="clearChecked()">清除已购</button>
      </div>
      <div id="shop-list-container"></div>
      <div style="display:flex;gap:6px;margin-top:10px">
        <input type="text" id="shop-new-name" placeholder="添加食材..." style="flex:1;font-size:12px;padding:5px 8px" onkeydown="if(event.key==='Enter')addShopItem()">
        <input type="text" id="shop-new-cat" placeholder="分类" style="width:60px;font-size:12px;padding:5px 8px" onkeydown="if(event.key==='Enter')addShopItem()">
        <button class="btn small" onclick="addShopItem()">添加</button>
      </div>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat-area">
    <div class="chat-messages" id="chat-messages">
      <div class="empty-chat" id="empty-state">
        <div class="icon">🥢</div>
        <p>输入 API Key 后开始对话，我会帮你规划本周餐谱并整理采购清单</p>
      </div>
    </div>
    <div class="quick-btns" id="quick-btns">
      <button class="quick-btn" onclick="quickSend('帮我开始规划本周餐谱')">开始规划本周 →</button>
      <button class="quick-btn" onclick="quickSend('根据我家现有食材推荐几道菜')">推荐菜品</button>
      <button class="quick-btn" onclick="quickSend('帮我生成采购清单')">生成采购清单</button>
      <button class="quick-btn" onclick="quickSend('这周吃得营养均衡吗？')">营养分析</button>
    </div>
    <div class="chat-input-area">
      <div class="autocomplete-wrap">
        <div class="ac-dropdown" id="ac-dropdown" style="display:none"></div>
        <textarea id="chat-input" rows="1" placeholder="和助手说话..." onkeydown="handleKey(event)" oninput="autoResize(this);onChatInput(this)" onblur="setTimeout(hideAC,150)"></textarea>
      </div>
      <button class="btn primary" id="send-btn" onclick="sendMessage()">发送</button>
    </div>
  </div>
</div>

<script>
const DAYS = ['周一','周二','周三','周四','周五','周六','周日'];
const SYSTEM_PROMPT = `你是一个贴心的中文餐谱规划助手。用户在英国生活，平时有 meal deal 便餐选项，喜欢中餐，偶尔吃西餐。

你的职责：
1. 每周帮用户规划7天、每天两餐（午餐+晚餐）的菜单
2. 规划时主动询问：本周家里有哪些食材、哪几天打算外食或吃 meal deal
3. 建议要营养均衡、食材多样、避免连续重复
4. 规划完成后，当用户要求时，整理出采购清单（排除已有食材），并按分类列出（蔬菜/肉类/主食/调料等）
5. 当你确定了某天的餐谱时，用以下格式输出让系统解析（每行一个）：
   [MEAL:周X:午餐:菜名]
   [MEAL:周X:晚餐:菜名]
6. 当你生成采购清单时，用以下格式输出：
   [SHOP:分类:食材名]
7. 回答简洁自然，像朋友聊天一样，不要太正式`;

let messages = [];
let meals = {};
let inventory = [];
let shopping = [];
let preferences = []; // permanent user preferences, never cleared

function getWeekDates() {
  const today = new Date();
  const dow = today.getDay();
  const offset = dow === 0 ? -6 : 1 - dow;
  const monday = new Date(today);
  monday.setDate(today.getDate() + offset);
  return Array.from({length:7}, (_,i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return d;
  });
}

function init() {
  const saved = JSON.parse(localStorage.getItem('meal_agent') || '{}');
  meals = saved.meals || {};
  inventory = saved.inventory || [];
  messages = saved.messages || [];
  shopping = saved.shopping || [];
  preferences = JSON.parse(localStorage.getItem('meal_agent_prefs') || '[]');

  const savedProvider = localStorage.getItem('meal_agent_provider') || 'anthropic';
  currentProvider = savedProvider;

const PROVIDERS = {

    buildPayload: (msgs, max_tokens, systemPrompt) => ({model: 'claude-sonnet-4-20250514', max_tokens, messages: msgs}),
    extractText: (data) => data.content.map(c=>c.text||'').join(''),
    isError: (data) => !!data.error,
    getError: (data) => data.error?.message || 'Unknown error',
  },
  deepseek: {
    placeholder: 'sk-...',
    buildPayload: (msgs, max_tokens, systemPrompt) => ({
      model: 'deepseek-chat',
      max_tokens,
      messages: [
        {role: 'system', content: systemPrompt},
        ...msgs.slice(2)
      ]
    }),
    extractText: (data) => data.choices?.[0]?.message?.content || '',
    isError: (data) => !!data.error,
    getError: (data) => data.error?.message || 'Unknown error',
  }
};

async function callAPI(providerName, key, payload) {
  const res = await fetch('/api/chat', {
    method: 'POST',

    body: JSON.stringify({ provider: providerName, key, payload })

}

// Built-in fallback shelf life (fridge storage, days)
const SHELF_LIFE = {
  '鸡蛋': 21, '牛奶': 7, '酸奶': 14, '豆腐': 4, '豆浆': 3,
  '猪肉': 3, '牛肉': 3, '肥牛': 3, '羊肉': 3, '鸡肉': 3, '鸭肉': 3,
  '三文鱼': 2, '虾': 2, '鱼': 2, '海鲜': 2,
  '叶菜': 4, '菠菜': 4, '生菜': 5, '白菜': 7, '西兰花': 5,
  '胡萝卜': 14, '土豆': 30, '洋葱': 30, '大蒜': 30, '红薯': 21,
  '番茄': 7, '西红柿': 7, '黄瓜': 7, '茄子': 7, '辣椒': 7,
  '苹果': 14, '香蕉': 5, '草莓': 3, '葡萄': 7,
  '面条': 365, '大米': 365, '乌冬': 365, '面粉': 180,
  '螺蛳粉': 180, '泡面': 365,
};

// Cache: { name -> {days, source, fetched} }
let shelfCache = JSON.parse(localStorage.getItem('shelf_cache') || '{}');

function saveShelfCache() {
  localStorage.setItem('shelf_cache', JSON.stringify(shelfCache));
}

function getShelfDays(name) {
  // Check online cache first
  if (shelfCache[name]) return shelfCache[name].days;
  // Fall back to built-in
  for (const [k, v] of Object.entries(SHELF_LIFE)) {
    if (name.includes(k)) return v;
  }
  return null;
}

function getShelfSource(name) {
  return shelfCache[name]?.source || null;
}

async function lookupShelfLife(name) {
  const key = localStorage.getItem('meal_agent_key_'+currentProvider) || '';
  if (!key) return;
  if (shelfCache[name]) return; // already cached

  // Mark as loading
  const tags = document.getElementById('inventory-tags');
  const tagEl = [...tags.querySelectorAll('.inv-tag')].find(el => el.dataset.name === name);
  if (tagEl) tagEl.classList.add('loading');

  const prompt = `You are a food safety expert. For the ingredient "${name}", search authoritative sources (FDA, StillTasty, USDA, NHS, or similar) and tell me:
1. How many days can it be stored in the refrigerator (冰箱)?
2. Which source did you use?

Reply ONLY in this exact JSON format (no markdown, no extra text):
{"days": <number>, "source": "<source name>", "note": "<one sentence in Chinese>"}

If it's a dry/shelf-stable item stored at room temperature, use that instead and set "storage": "room".`;

  try {
    const msgs = currentProvider === 'anthropic'
      ? [
          {role:'user', content: 'You are a food safety expert. Reply only in JSON.'},
          {role:'assistant', content: 'Understood. I will reply only in JSON format.'},
          {role:'user', content: prompt}
        ]
      : [{role:'user', content: prompt}];

    const payload = currentProvider === 'anthropic'
      ? {model:'claude-sonnet-4-20250514', max_tokens:200, messages: msgs}
      : {model:'deepseek-chat', max_tokens:200, messages:[{role:'system',content:'Reply only in JSON.'},{role:'user',content:prompt}]};

    const data = await callAPI(currentProvider, key, payload);
    const text = provider.extractText(data);
    const clean = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    if (parsed.days && parsed.days > 0) {
      shelfCache[name] = {
        days: parsed.days,
        source: parsed.source || 'AI',
        note: parsed.note || '',
        fetched: new Date().toISOString()
      };
      saveShelfCache();
      renderInventory();
      checkFreshness();
    }
  } catch(e) {
    // Silently ignore - CORS or network error, fallback to built-in data
  } finally {
    if (tagEl) tagEl.classList.remove('loading');
  }
}

function renderInventory() {
  const area = document.getElementById('inventory-tags');
  const today = new Date(); today.setHours(0,0,0,0);
  area.innerHTML = inventory.map((item, i) => {

    const date = typeof item === 'object' ? item.date : null;
    let tooltipClass = '';
    let tooltipText = '';
    if (date) {
      const bought = new Date(date); bought.setHours(0,0,0,0);
      const daysKept = Math.floor((today - bought) / 86400000);
      const shelfDays = getShelfDays(name);
      const boughtStr = bought.toLocaleDateString('zh-CN', {month:'numeric',day:'numeric'});
      tooltipText = `购买：${boughtStr}　已存放 ${daysKept} 天`;
      if (shelfDays) {
        const daysLeft = shelfDays - daysKept;
        if (daysLeft <= 0) {
          tooltipText += `
⚠️ 可能已变质`;
          tooltipClass = 'warn';
        } else if (daysLeft <= 2) {
          tooltipText += `
⚠️ ${daysLeft} 天内需食用`;
          tooltipClass = 'caution';
        } else {
          tooltipText += `
还能存放约 ${daysLeft} 天`;
        }
      }
    }
    const dot = tooltipClass === 'warn' ? ' 🔴' : tooltipClass === 'caution' ? ' 🟡' : '';
    return `<div class="inv-tag" data-name="${name}">
      ${name}${dot}
      ${tooltipText ? `<div class="inv-tooltip ${tooltipClass}" style="white-space:pre">${tooltipText}</div>` : ''}

  }).join('');
}

function parseMealTags(text) {
  const mealRe = /\[MEAL:([^:]+):([^:]+):([^\]]+)\]/g;
  let m;
  while ((m = mealRe.exec(text)) !== null) {
    const [, day, type, name] = m;
    if (!meals[day]) meals[day] = {};
    if (type.includes('午')) meals[day].lunch = name.trim();
    else meals[day].dinner = name.trim();
  }

  const shopRe = /\[SHOP:([^:]+):([^\]]+)\]/g;
  const newItems = [];
  while ((m = shopRe.exec(text)) !== null) {
    const [, cat, name] = m;
    const nm = name.trim();
    if (!shopping.find(s => s.name === nm)) {
      newItems.push({cat: cat.trim(), name: nm, done: false});
    }
  }
  if (newItems.length > 0) shopping.push(...newItems);

  const clean = text
    .replace(/\[MEAL:[^\]]+\]/g, '')
    .replace(/\[SHOP:[^\]]+\]/g, '')
    .trim();
  return clean;
}

async function sendMessage(text) {
  const key = localStorage.getItem('meal_agent_key_'+currentProvider) || '';
  if (!key) { alert('请先输入 API Key'); return; }

  const input = document.getElementById('chat-input');
  const userText = text || input.value.trim();
  if (!userText) return;

  document.getElementById('empty-state').style.display = 'none';
  input.value = '';
  input.style.height = 'auto';

  // Check for preference message (starts with *)
  if (userText.startsWith('*')) {
    const prefText = userText.slice(1).trim();
    if (prefText && !preferences.includes(prefText)) {
      preferences.push(prefText);
      save();
      renderPreferences();
    }
    // Show confirmation in chat, don't send to API
    document.getElementById('empty-state').style.display = 'none';
    const uDiv = document.createElement('div');
    uDiv.className = 'msg user';
    uDiv.textContent = userText;
    document.getElementById('chat-messages').appendChild(uDiv);
    const aDiv = document.createElement('div');
    aDiv.className = 'msg assistant';
    aDiv.textContent = `✅ 已记住：${prefText}，这个偏好会一直保留，每周规划时都会考虑到。`;
    document.getElementById('chat-messages').appendChild(aDiv);
    document.getElementById('chat-messages').scrollTop = 99999;
    document.getElementById('send-btn').disabled = false;
    return;
  }

  const userMsg = {role:'user', content: userText, displayContent: userText};
  messages.push(userMsg);

  const userDiv = document.createElement('div');
  userDiv.className = 'msg user';
  userDiv.textContent = userText;
  const container = document.getElementById('chat-messages');
  container.appendChild(userDiv);

  const typingDiv = document.createElement('div');
  typingDiv.className = 'typing';
  typingDiv.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  container.appendChild(typingDiv);
  container.scrollTop = container.scrollHeight;

  document.getElementById('send-btn').disabled = true;

  const invNames = inventory.map(i => typeof i === 'string' ? i : i.name);
  const invSummary = invNames.length > 0 ? `\n\n用户家里现有食材：${invNames.join('、')}` : '';
  const prefSummary = preferences.length > 0 ? `\n\n用户个人偏好（永久记住）：\n${preferences.map(p=>'- '+p).join('\n')}` : '';
  const mealSummary = Object.keys(meals).length > 0
    ? '\n\n当前已规划的餐谱：\n' + DAYS.filter(d=>meals[d]).map(d=>`${d}：午餐${meals[d].lunch||'未定'}，晚餐${meals[d].dinner||'未定'}`).join('\n')
    : '';

  const apiMessages = [
    {role:'user', content: SYSTEM_PROMPT + invSummary + prefSummary + mealSummary + '\n\n请开始对话。'},
    {role:'assistant', content: '好的，我来帮你规划本周餐谱！'},
    ...messages.slice(0,-1).filter(m=>m.role!=='system').map(m=>({role:m.role, content:m.content})),
    {role:'user', content: userText}
  ];

  const MAX_RETRIES = 3;
  let attempt = 0;
  let lastError = null;

  while (attempt < MAX_RETRIES) {
    attempt++;
    try {
      if (attempt > 1) {
        typingDiv.querySelector('.typing-dots').insertAdjacentHTML('afterend',
          `<span style="font-size:11px;color:var(--muted);margin-left:6px">重试 ${attempt}/${MAX_RETRIES}…</span>`);
        await new Promise(r => setTimeout(r, 1000 * attempt));
      }

      const provider = PROVIDERS[currentProvider];
      const data = await callAPI(currentProvider, key, provider.buildPayload(apiMessages, 1000, SYSTEM_PROMPT + invSummary + prefSummary + mealSummary));

      if (provider.isError(data)) {
        const isRetryable = res.status === 500 || res.status === 529 || res.status === 503;
        if (isRetryable && attempt < MAX_RETRIES) { lastError = provider.getError(data); continue; }
        throw new Error(provider.getError(data));
      }

      typingDiv.remove();
      const rawText = provider.extractText(data);
      const displayText = parseMealTags(rawText);

      const aMsg = {role:'assistant', content: rawText, displayContent: displayText};
      messages.push(aMsg);

      const aDiv = document.createElement('div');
      aDiv.className = 'msg assistant';
      aDiv.textContent = displayText;
      container.appendChild(aDiv);
      container.scrollTop = container.scrollHeight;

      renderMealGrid();
      renderShopping();
      save();
      lastError = null;
      break;

    } catch(e) {
      lastError = e.message;
      if (attempt >= MAX_RETRIES) break;
    }
  }

  if (lastError) {
    typingDiv.remove();
    const errDiv = document.createElement('div');
    errDiv.className = 'msg assistant';
    const retried = attempt > 1 ? `（已重试 ${attempt} 次）` : '';
    errDiv.textContent = `出错了${retried}：${lastError}`;
    container.appendChild(errDiv);
    container.scrollTop = container.scrollHeight;
  }

  document.getElementById('send-btn').disabled = false;
}

function handleKey(e) {
  const dd = document.getElementById('ac-dropdown');
  if (dd.style.display !== 'none') {
    if (e.key === 'ArrowDown') { e.preventDefault(); navigateAC(1); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); navigateAC(-1); return; }
    if (e.key === 'Enter' && acIndex >= 0) {
      e.preventDefault();
      const item = dd.querySelectorAll('.ac-item')[acIndex];
      if (item) pickAC(item.dataset.val);
      return;
    }
    if (e.key === 'Escape') { hideAC(); return; }
  }
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function checkFreshness() {
  const today = new Date(); today.setHours(0,0,0,0);
  const warnings = [];
  inventory.forEach(item => {
    const name = typeof item === 'string' ? item : item.name;
    const date = typeof item === 'object' ? item.date : null;
    if (!date) return;
    const bought = new Date(date); bought.setHours(0,0,0,0);
    const daysKept = Math.floor((today - bought) / 86400000);
    const shelfDays = getShelfDays(name);
    if (!shelfDays) return;
    const daysLeft = shelfDays - daysKept;
    if (daysLeft <= 0) warnings.push(`🔴 ${name}：可能已变质（已存放 ${daysKept} 天）`);
    else if (daysLeft <= 3) warnings.push(`🟡 ${name}：还剩约 ${daysLeft} 天，请尽快食用`);
  });
  const banner = document.getElementById('freshness-banner');
  if (warnings.length > 0) {
    banner.style.display = 'block';
    banner.innerHTML = `<strong>⚠️ 食材保鲜提醒</strong>${warnings.join('<br>')}`;
  } else {
    banner.style.display = 'none';
  }
}

  meals = {}; messages = []; shopping = []; // preferences intentionally kept
  save();
  renderMealGrid();
  renderMessages();
  renderShopping();
  document.getElementById('empty-state').style.display = 'flex';
  checkFreshness();
}

function exportSVG() {
  const W = 640, PD = 24, ROW = 48, HDR = 40, TOP = 70;

    const fill = i%2===0 ? '#fff' : '#F7F4EE';

    return `<rect x="${PD}" y="${y}" width="${W-PD*2}" height="${ROW}" fill="${fill}"/>

// ── Autocomplete ──────────────────────────────────────────
let dishHistory = [];
let acIndex = -1;

function loadDishHistory() {
  dishHistory = JSON.parse(localStorage.getItem('dish_history') || '[]');
}

function saveDishToHistory(name) {
  if (!name || name.length < 2) return;
  if (!dishHistory.includes(name)) {
    dishHistory.unshift(name);
    if (dishHistory.length > 200) dishHistory = dishHistory.slice(0, 200);
    localStorage.setItem('dish_history', JSON.stringify(dishHistory));
  }
}

function extractDishesFromMeals() {
  const dishes = new Set(dishHistory);
  Object.values(meals).forEach(m => {
    if (m.lunch) m.lunch.split(/[，,、]/).forEach(d => { const t=d.trim(); if(t) dishes.add(t); });
    if (m.dinner) m.dinner.split(/[，,、]/).forEach(d => { const t=d.trim(); if(t) dishes.add(t); });
  });
  return [...dishes];
}

function getLastWord(text) {
  const parts = text.split(/[\n，,、 ]+/);
  return parts[parts.length - 1].trim();
  return parts[parts.length - 1].trim();
}

function onChatInput(el) {
  const val = el.value;
  const word = getLastWord(val);
  if (word.length < 1) { hideAC(); return; }
  const all = extractDishesFromMeals();
  const matched = all.filter(d => d.includes(word) && d !== word).slice(0, 8);
  if (matched.length === 0) { hideAC(); return; }
  showAC(matched, word, el);
}

function showAC(items, query, input) {
  const dd = document.getElementById('ac-dropdown');
  acIndex = -1;
  dd.innerHTML = '<div class="ac-section">历史菜品</div>' +
    items.map((item, i) =>
      `<div class="ac-item" data-val="${item}" onmousedown="pickAC('${item.replace(/'/g,"\'")}', event)">
        <span>${item.replace(query, '<b style=color:var(--accent)>'+query+'</b>')}</span>
      </div>`
    ).join('');
  dd.style.display = 'block';
}

function hideAC() {
  document.getElementById('ac-dropdown').style.display = 'none';
  acIndex = -1;
}

function pickAC(val, e) {
  if (e) e.preventDefault();
  const input = document.getElementById('chat-input');
  const text = input.value;
  const word = getLastWord(text);
  const idx = text.lastIndexOf(word);
  input.value = text.slice(0, idx) + val;
  hideAC();
  input.focus();
  autoResize(input);
}

function navigateAC(dir) {
  const dd = document.getElementById('ac-dropdown');
  if (dd.style.display === 'none') return false;
  const items = dd.querySelectorAll('.ac-item');
  if (!items.length) return false;
  items[acIndex]?.classList.remove('active');
  acIndex = (acIndex + dir + items.length) % items.length;
  items[acIndex].classList.add('active');
  return true;
}

// Hook into parseMealTags to record dishes
const _origParse = parseMealTags;
parseMealTags = function(text) {
  const mealRe = /\[MEAL:[^:]+:[^:]+:([^\]]+)\]/g;
  let m;
  while ((m = mealRe.exec(text)) !== null) saveDishToHistory(m[1].trim());
  return _origParse(text);
};

// Also save when user manually types dish names in chat
function extractAndSaveDishesFromUserText(text) {
  // Save short phrases that look like dish names (2-10 chars, no punctuation-only)
  text.split(/[，,、\n]/).forEach(p => {
    const t = p.trim();
    if (t.length >= 2 && t.length <= 15) saveDishToHistory(t);
  });
}

function exportShoppingSVG() {
  if (shopping.length === 0) { alert('采购清单是空的，先生成清单吧'); return; }
  const W = 480, PD = 24, ROW = 36, HDR = 40, TOP = 70, CAT_H = 28;
  const bycat = {};
  shopping.filter(s=>!s.done).forEach(s => {
    if (!bycat[s.cat]) bycat[s.cat] = [];
    bycat[s.cat].push(s.name);
  });
  const cats = Object.keys(bycat);
  let totalRows = cats.reduce((n, c) => n + bycat[c].length, 0);
  let totalCats = cats.length;
  const H = TOP + HDR + totalCats * CAT_H + totalRows * ROW + PD;

  let body = '';
  let y = TOP + HDR;
  cats.forEach((cat, ci) => {
    body += `<rect x="${PD}" y="${y}" width="${W-PD*2}" height="${CAT_H}" fill="#F0EDE6"/>
<text x="${PD+10}" y="${y+CAT_H/2+4}" font-size="10" font-weight="500" fill="#7A7468" font-family="system-ui,sans-serif" letter-spacing="1">${cat.toUpperCase()}</text>`;
    y += CAT_H;
    bycat[cat].forEach((item, ii) => {
      const fill = ii%2===0 ? '#fff' : '#F7F4EE';
      body += `<rect x="${PD}" y="${y}" width="${W-PD*2}" height="${ROW}" fill="${fill}"/>
<line x1="${PD}" y1="${y}" x2="${W-PD}" y2="${y}" stroke="#DDD8CE" stroke-width="0.5"/>
<rect x="${PD+10}" y="${y+ROW/2-5}" width="10" height="10" rx="2" fill="none" stroke="#DDD8CE" stroke-width="1"/>
<text x="${PD+28}" y="${y+ROW/2+5}" font-size="13" fill="#1C1A16" font-family="system-ui,sans-serif">${item}</text>`;
      y += ROW;
    });
  });

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
<rect width="${W}" height="${H}" fill="#F7F4EE"/>
<rect x="${PD}" y="${PD}" width="${W-PD*2}" height="36" rx="6" fill="#F5E8DF"/>
<text x="${W/2}" y="${PD+24}" text-anchor="middle" font-size="15" font-weight="600" fill="#B85C2A" font-family="system-ui,sans-serif">采购清单</text>
<rect x="${PD}" y="${TOP}" width="${W-PD*2}" height="${HDR}" fill="#F0EDE6"/>
<text x="${PD+10}" y="${TOP+HDR/2+5}" font-size="11" fill="#7A7468" font-family="system-ui,sans-serif">待购食材</text>
<text x="${W-PD-10}" y="${TOP+HDR/2+5}" text-anchor="end" font-size="11" fill="#7A7468" font-family="system-ui,sans-serif">${shopping.filter(s=>!s.done).length} 项</text>
${body}
<rect x="${PD}" y="${TOP}" width="${W-PD*2}" height="${HDR + totalCats*CAT_H + totalRows*ROW}" fill="none" stroke="#DDD8CE" stroke-width="0.5" rx="4"/>
</svg>`;

  const blob = new Blob([svg], {type:'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='采购清单.svg'; a.click();
  URL.revokeObjectURL(url);
}
